<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192" role="img" aria-label="Bureau des Planqués — un Planqué avachi à son poste, un café à la main">
  <defs>
    <linearGradient id="bp-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f" />
      <stop offset="0.55" stop-color="#0e1830" />
      <stop offset="1" stop-color="#070c16" />
    </linearGradient>
    <radialGradient id="bp-lamp" cx="0.24" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#e6b64c" stop-opacity="0.22" />
      <stop offset="1" stop-color="#e6b64c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bp-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d68a" />
      <stop offset="1" stop-color="#a67c22" />
    </linearGradient>
    <linearGradient id="bp-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a6b" />
      <stop offset="1" stop-color="#26324c" />
    </linearGradient>
    <linearGradient id="bp-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ef7" stop-opacity="0.9" />
      <stop offset="0.6" stop-color="#2f6fd0" stop-opacity="0.55" />
      <stop offset="1" stop-color="#e6b64c" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="bp-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22304e" />
      <stop offset="1" stop-color="#141d33" />
    </linearGradient>
  </defs>

  <!-- Fond : bleu nuit corporate + halo or discret -->
  <rect width="192" height="192" rx="112" fill="url(#bp-wall)" />
  <rect width="192" height="192" rx="112" fill="url(#bp-lamp)" />
  <rect x="26" y="26" width="460" height="460" rx="96" fill="none" stroke="url(#bp-gold)" stroke-width="3" opacity="0.4" />

  <!-- Sol -->
  <rect x="0" y="392" width="512" height="120" fill="#070c16" opacity="0.55" />

  <!-- Écran de contrôle, à gauche du poste -->
  <rect x="70" y="236" width="104" height="96" rx="12" fill="#0b1322" stroke="#2b3a5c" stroke-width="3" />
  <rect x="79" y="245" width="86" height="78" rx="7" fill="url(#bp-screen)" opacity="0.85" />
  <path d="M86 268h44M86 284h64M86 300h32" stroke="#e8eef8" stroke-width="5" stroke-linecap="round" opacity="0.55" />
  <rect x="114" y="332" width="12" height="24" fill="#22304e" />
  <rect x="90" y="352" width="60" height="9" rx="4.5" fill="#22304e" />

  <!-- Dossier de la chaise, derrière le Planqué -->
  <rect x="170" y="188" width="172" height="190" rx="58" fill="#16223a" stroke="#33415e" stroke-width="3" />

  <!-- Le Planqué : torse avachi, tête penchée -->
  <path d="M186 352 C186 284 214 246 256 246 C298 246 326 284 326 352 Z" fill="url(#bp-suit)" />
  <path d="M186 352 C186 284 214 246 256 246" fill="none" stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" opacity="0.28" />
  <path d="M234 254 L256 292 L278 254" fill="#e8eef8" opacity="0.92" />
  <path d="M250 298 L262 298 L259 332 L256 340 L253 332 Z" fill="url(#bp-gold)" />

  <g transform="rotate(-8 256 226)">
    <circle cx="256" cy="228" r="45" fill="#e7cbaa" />
    <!-- Cheveux : la calotte sombre couvre le crâne, la lumière vient de la gauche. -->
    <path d="M209 228 C203 178 309 178 303 228 C298 205 287 197 256 197 C225 197 214 205 209 228 Z" fill="#111a2c" />
    <path d="M216 208 C226 194 246 189 256 189" stroke="#2b3a5c" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9" />
    <!-- Yeux fermés, la tête posée : l'air de quelqu'un qui ne se presse pas. -->
    <path d="M231 236 q8 7 16 0" stroke="#7b88a3" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M266 236 q8 7 16 0" stroke="#7b88a3" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M248 262 q8 5 16 0" stroke="#8a97b0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Bras gauche posé sur le bureau -->
  <path d="M212 300 C198 320 194 340 196 352" stroke="url(#bp-suit)" stroke-width="24" fill="none" stroke-linecap="round" />
  <ellipse cx="198" cy="348" rx="13" ry="10" fill="#e7cbaa" opacity="0.95" />

  <!-- Bras droit tendu vers la tasse -->
  <path d="M300 298 C318 306 332 314 340 322" stroke="url(#bp-suit)" stroke-width="24" fill="none" stroke-linecap="round" />

  <!-- Bureau -->
  <rect x="48" y="352" width="416" height="30" rx="15" fill="url(#bp-desk)" />
  <rect x="60" y="352" width="392" height="5" rx="2.5" fill="#3b4a6b" opacity="0.8" />

  <!-- La tasse de Café, motif maison -->
  <path d="M390 306 h8 a16 16 0 0 1 0 32 h-8" fill="none" stroke="url(#bp-gold)" stroke-width="8" stroke-linecap="round" />
  <rect x="334" y="300" width="52" height="52" rx="10" fill="url(#bp-gold)" />
  <rect x="340" y="302" width="40" height="8" rx="4" fill="#fbeecb" opacity="0.55" />
  <ellipse cx="344" cy="326" rx="15" ry="18" fill="#e7cbaa" opacity="0.95" />
  <path d="M356 262 c-9 11 5 17 -3 27" fill="none" stroke="#f4d68a" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M374 254 c-9 11 5 17 -3 27" fill="none" stroke="#f4d68a" stroke-width="6" stroke-linecap="round" opacity="0.5" />

  <!-- Plante d'angle -->
  <path d="M446 340 C430 318 434 288 448 274 C462 288 466 318 446 340 Z" fill="#1f8a68" opacity="0.9" />
  <path d="M448 340 C428 336 416 318 415 300 C436 300 448 316 448 340 Z" fill="#1f8a68" opacity="0.65" />
  <path d="M448 340 C468 338 482 322 484 304 C463 302 449 318 448 340 Z" fill="#1f8a68" opacity="0.65" />
  <path d="M424 340 h48 l-7 44 h-34 Z" fill="#26324c" />
  <rect x="418" y="334" width="60" height="12" rx="6" fill="#33415e" />

  <!-- Signature : le nom, lisible dans la grande icône -->
  <text x="256" y="474" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="1.5" fill="#f4d68a">Bureau des Planqués</text>
</svg>
