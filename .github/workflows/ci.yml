name: CI

# Vérifie la batterie de AGENTS.md §7 à chaque push et pull request vers main.
#
# **Trois jobs en parallèle, et non un seul** (ticket #257, rétro du 26/10/2026). Un job unique
# prenait 11 min 41 s pour un `timeout-minutes: 15`, dont **8 min 13 s de tests**. Le 26/10, le
# même code a mis **287 s** de tests sur une PR et **525 s** sur `main` : 1,8× d'écart pour un
# runner plus chargé. Avec une somme, cette variance décide du rouge ; avec un maximum, elle ne
# mange que la marge du job le plus lourd.
#
# Le découpage suit les **deux projets de `vitest.config.ts`** — `node` et `ui` — plus les
# contrôles. `npm test` en local reste **la commande unique** qui lance les deux : la CI ne
# fait que les répartir sur deux machines.
#
# **Ce qui a été mesuré et REFUSÉ le 28/10/2026** (#422, D-143 (4)) — ne pas le reproposer sans
# une mesure qui contredise celle-ci :
#
# - **Un job d'installation partagé, `node_modules` en artefact.** `node_modules` pèse
#   **1,9 Go / 36 625 fichiers** ici : le transférer coûte plus que le `npm ci` qu'il remplace
#   (le cache `npm` de `setup-node` est déjà chaud). Et surtout, un préalable commun **sérialise**
#   les trois jobs : ils ne sont plus un maximum mais une somme, ce que D-115 a précisément
#   écarté (job unique = 11 min 41 s).
# - **Un build unique partagé en `dist/`.** Même raison : la porte est un **maximum** (murs
#   mesurés 1 min 46 / 2 min 03 / 3 min 37), et le mur est `tests du noyau` — économiser
#   20 s sur les deux autres jobs ne déplace pas d'une seconde le temps de la PR. `dist/` fait
#   29 Mo, pour un build de 9,4 s en local.
# - **`isolate: false`.** Mesuré deux fois : le projet `node` donne le même compte de tests
#   (1 904) et zéro échec, mais le projet `ui` **casse** — 46 puis 28 échecs, et le nombre de
#   succès change d'un run à l'autre (493 puis 511). Un état fuit : refusé.

#
# Mesures du 26/10/2026 en local (12 cœurs) : `node` 63 s / 1379 tests, `ui` 37 s / 346 tests,
# 149 fichiers vus pour 149 sur le disque.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Ce qui n'est ni un test ni un écran : les types, la forme, les garde-fous, le build.
  controles:
    name: contrôles (types, format, garde-fous, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      # Node 24 : version vérifiée du dépôt (AGENTS.md §7).
      - name: Installer Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # **Le chemin rapide** (D-143, #422) : une PR qui ne touche que de la documentation (`docs/**`,
      # `*.md` hors `design/` et `src/`) ne rejoue que les tests qui **lisent un document**. Le job
      # **tourne toujours** et sort vite en succès : un job non déclenché (`paths-ignore`) ne
      # reporterait jamais son statut, et le ruleset de `main` attend les trois noms ci-dessous.
      # Un push sur `main` n'a pas de base : il prend toujours la suite complète.
      - name: Calculer ce que le changement peut casser (D-143)
        id: chemins
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            node scripts/ci/ci-chemins.mjs --base "$BASE"
          else
            node scripts/ci/ci-chemins.mjs
          fi

      - name: Installer les dépendances
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm ci

      - name: Vérifier les types
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm run check

      # Le formatage (rétro du 26/10/2026) : le dépôt n'avait **aucun** formateur, et 316
      # commits en trois jours l'ont montré — 537 lignes de plus de 120 caractères, deux
      # fichiers hors shadcn en guillemets doubles, un `npx prettier` téléchargé à la volée.
      # Prettier est épinglé en devDependency exacte, la config vit dans `.prettierrc.json`,
      # et `.prettierignore` dit ce qu'il ne touche **pas** (src/data : un texte de carte par
      # ligne, un repli changerait le texte affiché).
      - name: Vérifier le formatage
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm run format:check

      # Garde-fous (ticket #112) : mute un invariant critique et EXIGE que la suite échoue.
      # Une mutation qui passe inaperçue désigne une assertion qui ne garde rien — trois
      # cas ont été trouvés en une session (#101, #107, #103), d'où ce harnais.
      - name: Vérifier que les garde-fous peuvent échouer
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm run garde-fous

      # Garde de l'épinglage (#146), qui doit pouvoir échouer : remplacer la version par
      # `"latest"` dans package.json, ou `--no` par `--yes` ci-dessous → exit 1.
      - name: Vérifier que le détecteur d'UI reste épinglé
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const version = pkg.devDependencies && pkg.devDependencies.impeccable;
            if (!/^\d+\.\d+\.\d+$/.test(version || "")) {
              console.error("impeccable doit être épinglé en version exacte (sans ^ ni ~) en devDependencies — trouvé :", version);
              process.exit(1);
            }
            const ci = fs.readFileSync(".github/workflows/ci.yml", "utf8");
            if (/npx\s+(--yes|-y)\s+impeccable/.test(ci)) {
              console.error("la CI ne doit plus retélécharger le détecteur au moment du contrôle (npx --yes)");
              process.exit(1);
            }
            console.log("impeccable épinglé en " + version + " et lancé sans réseau par la CI");
          '

      - name: Détecter les anti-patterns d'interface
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm exec --no -- impeccable detect src/

      - name: Construire la production
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm run build

      # Un build valide produit ces deux fichiers (AGENTS.md §7 et §8.3).
      - name: Vérifier les artefacts du build
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: ls -la dist/index.html dist/sw.js

      - name: Chemin rapide — documentation seule, rien à contrôler ici (D-143)
        if: steps.chemins.outputs.doc_seulement == 'true'
        run: |
          echo "PR de documentation seule : types, format, garde-fous et build ne peuvent pas changer."

  # Le moteur, les données, les scripts, la migration du mur — le gros du temps de test.
  tests-noyau:
    name: tests du noyau (projet node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # **Le chemin rapide** (D-143, #422) : une PR qui ne touche que de la documentation (`docs/**`,
      # `*.md` hors `design/` et `src/`) ne rejoue que les tests qui **lisent un document**. Le job
      # **tourne toujours** et sort vite en succès : un job non déclenché (`paths-ignore`) ne
      # reporterait jamais son statut, et le ruleset de `main` attend les trois noms ci-dessous.
      # Un push sur `main` n'a pas de base : il prend toujours la suite complète.
      - name: Calculer ce que le changement peut casser (D-143)
        id: chemins
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            node scripts/ci/ci-chemins.mjs --base "$BASE"
          else
            node scripts/ci/ci-chemins.mjs
          fi

      - name: Installer les dépendances
        run: npm ci

      # Pillow — dépendance du tuyau d'illustration (AGENTS.md §6) : le wizard
      # `scripts/ressources/illustration-vague.sh` convertit les rendus de gflow (JPEG) en
      # webp, et son test fabrique de vraies images. Le paquet `python3-pil`
      # fournit `PIL` au python3 du runner, sans heurter PEP 668 (`pip` y refuse
      # l'installation système). Sans cette étape, 8 tests tombent en
      # `ModuleNotFoundError: No module named 'PIL'` — constaté le 21/10/2026.
      # Ces tests vivent dans `scripts/`, donc dans le projet `node` : Pillow n'est
      # pas installé dans le job des écrans, qui n'en a pas besoin.
      - name: Installer Pillow (conversion webp du tuyau d'illustration)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      # `npm test` en local lance **les deux projets** ; ici on en prend la moitié `node`.
      # `src/ci.test.ts` vérifie que les deux jobs couvrent exactement les projets déclarés
      # dans `vitest.config.ts` : ajouter un projet sans l'appeler ici fait échouer la suite.
      - name: Lancer les tests du noyau
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm test -- --project=node

      # Le chemin rapide : les tests du projet `node` qui lisent un document (les gardes de
      # cohérence de D-143 (1), `capturer.test.ts` qui relit D-142…). Calculés, pas recopiés.
      - name: Chemin rapide — les tests qui lisent un document (D-143)
        if: steps.chemins.outputs.doc_seulement == 'true'
        env:
          TESTS: ${{ steps.chemins.outputs.tests_node }}
        run: npx vitest run $TESTS

  # Les écrans, rendus sous jsdom, puis le contrôle visuel des pages servies depuis `dist/`.
  tests-ecrans:
    name: tests des écrans + contrôle visuel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # **Le chemin rapide** (D-143, #422) : une PR qui ne touche que de la documentation (`docs/**`,
      # `*.md` hors `design/` et `src/`) ne rejoue que les tests qui **lisent un document**. Le job
      # **tourne toujours** et sort vite en succès : un job non déclenché (`paths-ignore`) ne
      # reporterait jamais son statut, et le ruleset de `main` attend les trois noms ci-dessous.
      # Un push sur `main` n'a pas de base : il prend toujours la suite complète.
      - name: Calculer ce que le changement peut casser (D-143)
        id: chemins
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            node scripts/ci/ci-chemins.mjs --base "$BASE"
          else
            node scripts/ci/ci-chemins.mjs
          fi

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests des écrans
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm test -- --project=ui

      - name: Construire la production
        if: steps.chemins.outputs.doc_seulement != 'true'
        run: npm run build

      # **Le contrôle visuel qui compte** (#205, #234) : `impeccable detect` sur les écrans
      # **servis depuis `dist/`**, avec le cliquet de `scripts/ci/detect-ui-pages.mjs`
      # (`ECRANS` = 12 écrans, `BASELINE` = leur compte mesuré). `detect:ui` ne lit que les
      # sources et sous-compte ; celui-ci voit le rendu réel.
      #
      # **Le Chromium vient de l'image du runner** (« l'image qui fournit », #234) : les
      # images `ubuntu-latest` livrent Google Chrome stable, donc l'installation coûte
      # **~0 min**, là où `npx playwright install chromium --with-deps` en ajouterait ~2.
      # `IMPECCABLE_BROWSER` le nomme au lieu de le laisser deviner, et le scan lui-même
      # ajoute **~1 à 2 min** au job (mesuré à 45 s en local, douze écrans, 26/10/2026).
      #
      # **Sans Chrome, l'étape ÉCHOUE** au lieu de se sauter : un scan d'URL qui n'a pas
      # tourné n'est pas un contrôle vert (même règle que #231 et que `npm run capturer`).
      # Le message dit quoi installer. Aucun secret : le navigateur est dans l'image.
      - name: Contrôler les écrans dans un navigateur (#205, #234)
        if: steps.chemins.outputs.doc_seulement != 'true'
        env:
          IMPECCABLE_BROWSER: /usr/bin/google-chrome
        run: |
          if [ ! -x "$IMPECCABLE_BROWSER" ]; then
            echo "::error::Chrome absent ($IMPECCABLE_BROWSER) : le scan d'URL d'impeccable n'a pas de navigateur. Installe-le (npx playwright install chromium --with-deps) et pointe IMPECCABLE_BROWSER dessus — ne saute pas le contrôle."
            exit 1
          fi
          "$IMPECCABLE_BROWSER" --version
          npm run detect:ui:page

      - name: Chemin rapide — les tests d'écran qui lisent un document (D-143)
        if: steps.chemins.outputs.doc_seulement == 'true'
        env:
          TESTS: ${{ steps.chemins.outputs.tests_ui }}
        run: npx vitest run $TESTS
